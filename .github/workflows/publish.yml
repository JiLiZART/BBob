name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  statuses: read
  deployments: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v6

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org/
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest

      - name: Prepare release version
        id: pre_release
        run: |
          RELEASE_VER=$(pnpm changeset status --output=./release.json && node scripts/ci/release-version.js | tail -n 1)
          echo "version=${RELEASE_VER}" >> $GITHUB_OUTPUT

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore(release): publish ${{ steps.pre_release.outputs.version }}"
          publish: npm run release
          commit: "chore(release): release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
